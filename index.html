<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Thavalon</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #1a1d24; --line: #2a2e37; --text: #e8e8ec; --muted: #8b8f9a;
      --accent: #7c6cf0; --green: #3fb950; --red: #f85149; --team: #2f3f6e;
      --green-bg: rgba(63, 185, 80, .22); --red-bg: rgba(248, 81, 73, .22);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 16px/1.4 system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    button { font: inherit; color: inherit; }
    #app { display: flex; flex-direction: column; height: 100dvh; }

    header { display: flex; justify-content: space-between; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .actions { display: flex; gap: .3rem; }
    header h1 { font-size: 1.5rem; }
    .btn { min-height: 44px; padding: 0 1rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
    .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; width: 100%; margin-top: 1rem; }
    .btn:disabled { opacity: .35; }
    .btn.small { min-height: 36px; padding: 0 .7rem; font-size: .9rem; }
    .btn.icon { min-width: 44px; min-height: 44px; font-size: 1.4rem; padding: 0 .35rem; }

    #context { padding: .5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--line); font-size: .95rem; display: flex; justify-content: space-between; }
    #context:empty { display: none; }
    #context .hammer { color: var(--red); font-weight: 700; }

    #screens { flex: 1; display: flex; overflow: hidden; }
    .screen { flex: 0 0 100%; overflow-y: auto; padding: 1rem; transition: transform .22s ease-out; }
    .screen.review { padding: .75rem .5rem; }

    .hint { color: var(--muted); font-size: .9rem; margin: .25rem 0 .75rem; }
    .error { color: var(--red); min-height: 1.4em; margin-top: .5rem; }

    .names { display: flex; flex-direction: column; gap: .4rem; }
    .names label { display: flex; align-items: center; gap: .4rem; }
    .names .seat-no { width: 1.4rem; color: var(--muted); font-size: .85rem; text-align: right; }
    .names input { flex: 1; min-width: 0; min-height: 44px; padding: 0 .6rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
    .names .king-pick { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); opacity: .45; }
    .names .king-pick.on { opacity: 1; background: var(--accent); border-color: var(--accent); }
    /* ⠿ handle: hold and drag a row to its seat. touch-action stops the page scrolling while dragging. */
    .names .drag { min-width: 34px; min-height: 44px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 1.3rem; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
    .names label.dragging { position: relative; z-index: 1; border-radius: 10px; background: rgba(124, 108, 240, .22); box-shadow: 0 4px 14px rgba(0, 0, 0, .45); }
    .names label.dragging .drag { color: var(--text); cursor: grabbing; }
    .roster-box { display: flex; flex-direction: column; gap: .4rem; margin-top: 1rem; }
    .roster { display: flex; gap: .4rem; align-items: center; }
    .roster-icon { min-width: 52px; text-align: center; font-size: 1.3rem; }
    .roster.server input { text-transform: none; font-size: .9rem; color: var(--muted); }
    .roster input { flex: 1; min-width: 0; min-height: 44px; padding: 0 .6rem; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; text-transform: uppercase; }
    .roster .btn { min-width: 52px; font-size: 1.3rem; padding: 0 .5rem; }

    /* the table: players around a circle in seating order, info in the middle */
    .ring { position: relative; width: min(100%, calc(100dvh - 340px)); aspect-ratio: 1; margin: .25rem auto; }
    .seat { position: absolute; width: 64px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
      gap: .15rem; background: none; border: 0; padding: 0; }
    .seat .token { width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--line); background: var(--panel);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; position: relative; }
    .seat .name { font-size: .72rem; line-height: 1.1; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
    .seat .crown { position: absolute; top: -14px; right: -8px; font-size: .95rem; }
    .seat .shield { position: absolute; bottom: -10px; right: -10px; font-size: 1.05rem; }
    .seat .hammer-mark { position: absolute; bottom: -10px; left: -10px; font-size: 1rem; }
    .seat .agravaine-face { font-size: 2.2rem; line-height: 1; }
    .seat.selected .token { border-color: var(--accent); background: rgba(124, 108, 240, .35); }
    .seat.selected .name { color: var(--text); }
    .seat.dim { opacity: .35; }
    .seat.approve .token { border-color: var(--green); background: var(--green-bg); color: var(--green); }
    .seat.reject .token { border-color: rgba(248, 81, 73, .45); color: var(--red); }
    .seat.team .name { color: var(--text); font-weight: 600; }
    .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 45%; }
    .center .big { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .center .sub { font-size: .85rem; color: var(--muted); margin-top: .25rem; }
    .center.verdict { aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .center.verdict.pass { background: rgba(63, 185, 80, .35); }
    .center.verdict.fail { background: rgba(248, 81, 73, .3); }

    .presets { display: flex; gap: .4rem; justify-content: center; margin-bottom: .25rem; }
    .presets .btn { min-height: 40px; padding: 0 .8rem; font-size: 1.05rem; }
    .presets .btn.on { border-color: var(--accent); background: rgba(124, 108, 240, .22); }

    .fails { display: flex; flex-direction: column; gap: .4rem; }
    .fails .btn { min-height: 52px; font-size: 1.4rem; letter-spacing: 3px; border-width: 2px; }
    .fails .btn.pass { background: rgba(63, 185, 80, .08); }
    .fails .btn.fail { background: rgba(248, 81, 73, .08); }
    .fails .btn.on.pass { border-color: var(--green); background: var(--green-bg); }
    .fails .btn.on.fail { border-color: var(--red); background: var(--red-bg); }
    /* the rare 🎭 counter: set apart below the rows, left-aligned, fixed width so nothing shifts */
    .rogue { display: flex; margin-top: 2.5rem; padding-top: .75rem; border-top: 1px dashed var(--line); }
    .rogue .btn { width: 5.5rem; min-height: 44px; font-size: 1.2rem; opacity: .6; font-variant-numeric: tabular-nums; }
    .rogue .btn.on { opacity: 1; border-color: var(--accent); background: rgba(124, 108, 240, .22); }
    .quest-team { margin-top: .9rem; display: flex; flex-direction: column; align-items: center; gap: .25rem; }
    .quest-team button { min-height: 40px; min-width: 9rem; padding: 0 .9rem; border-radius: 10px; border: 1px solid transparent; background: none; }
    .quest-team button.agravaine { border-color: var(--red); background: var(--red-bg); font-weight: 700; }

    .over { text-align: center; padding-top: 2rem; }
    .over .winner { font-size: 2rem; font-weight: 800; }
    .over .good { color: var(--green); } .over .evil { color: var(--red); }

    /* review */
    .score { display: flex; justify-content: space-around; align-items: center; padding: .25rem 0 .75rem; }
    .score .q { text-align: center; font-size: .75rem; color: var(--muted); }
    .score .q b { display: block; font-size: 1.4rem; line-height: 1.2; color: var(--text); }
    .score .q.pass b { color: var(--green); } .score .q.fail b { color: var(--red); } .score .q.now b { color: var(--accent); }
    .score .total { font-weight: 700; font-size: 1.1rem; }
    table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .9rem; }
    .grid th, .grid td { text-align: center; padding: 0; height: 32px; border-bottom: 1px solid var(--line); }
    .grid th { position: sticky; top: 0; background: var(--bg); font-weight: 600; vertical-align: bottom; padding-bottom: .3rem; }
    .grid th.vname span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: .75rem; }
    .grid td.label, .grid th.label { width: 2rem; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .grid td.res, .grid th.res { width: 1.6rem; }
    .grid td.team { background: var(--team); }
    .grid td.yes { color: var(--green); } .grid td.no { color: var(--red); opacity: .7; }
    .grid td.pending { color: var(--muted); }
    .grid td .crown { font-size: .7rem; vertical-align: super; }
    .grid tr.quest-start td { border-top: 2px solid var(--muted); }
    .grid tr.result td { height: 28px; font-size: .85rem; letter-spacing: 1px; }
    .grid tr.result td.pass { background: var(--green-bg); } .grid tr.result td.fail { background: var(--red-bg); }
    .grid tr.gap td { height: 14px; border: 0; }
    .grid .vdot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
    .grid .vdot.g { background: var(--green); } .grid .vdot.r { background: var(--red); opacity: .7; }

    nav.tabs { display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
    nav.tabs button { flex: 1; min-height: 52px; border: 0; background: none; color: var(--muted); font-weight: 600; }
    nav.tabs button.on { color: var(--text); box-shadow: inset 0 3px 0 var(--accent); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>🏰</h1>
      <div class="actions">
        <button id="new-game" class="btn small icon" title="New game">🎲</button>
        <button id="load" class="btn small icon" title="Load a saved game">📂</button>
        <input id="load-file" type="file" accept=".json,application/json" hidden>
        <button id="save" class="btn small icon" title="Save game to a file">💾</button>
        <button id="undo" class="btn small icon" title="Undo (also the phone's back button)">⏪</button>
      </div>
    </header>
    <div id="context"></div>
    <div id="screens">
      <section id="capture" class="screen capture"></section>
      <section id="review" class="screen review"></section>
    </div>
    <nav class="tabs">
      <button data-tab="capture" class="on">✍️ Capture</button>
      <button data-tab="review">📊 Review</button>
    </nav>
  </div>

  <script src="game.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = "thavalon.game";
      const $ = (sel) => document.querySelector(sel);
      const captureEl = $("#capture"), reviewEl = $("#review"), contextEl = $("#context"), undoBtn = $("#undo");

      // ---- state: the event log, plus transient UI selections for the current phase ----
      let events = load();
      let ui = freshUi();
      let tab = "capture";
      function freshUi() {
        return { chosen: new Set(), approvals: new Set(), fails: null, rogues: 0, agravaine: null, error: "",
          // Setup screen: kept here, not in the inputs, so a redraw (an error, a load, a move) keeps what was typed.
          setupNames: Array(10).fill(""), setupKing: -1, setupGameId: "", setupServer: defaultServer(), loading: false };
      }
      ui = { ...ui, ...defaultsFor(Game.replay(events)) };

      function load() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? Game.deserialize(saved) : Game.create();
        } catch (_) { return Game.create(); }
      }
      function save() { try { localStorage.setItem(STORAGE_KEY, Game.serialize(events)); } catch (_) {} }

      // Sensible starting selections for a phase: the king usually puts themselves on the team.
      function defaultsFor(view) {
        return view.phase === "propose" ? { chosen: new Set([view.king]) } : {};
      }

      function commit(next, seed = {}) {
        events = next;
        ui = { ...freshUi(), ...defaultsFor(Game.replay(events)), ...seed };
        save();
        render();
      }

      // Going back re-opens the previous step with what had been entered, so a mis-tap costs one correction, not a re-entry.
      function back() {
        const last = events.at(-1);
        if (!last) return;
        const seed = {};
        if (last.type === "propose") seed.chosen = new Set(last.team);
        if (last.type === "vote") seed.approvals = new Set(last.approvals);
        if (last.type === "quest") { seed.fails = last.fails; seed.rogues = last.rogues ?? 0; seed.agravaine = last.agravaine ?? null; }
        commit(Game.undo(events), seed);
      }
      function tryAppend(event) {
        try { commit(Game.append(events, event)); }
        catch (error) { ui.error = error.message; renderCapture(); }
      }

      // ---- DOM helper ----
      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(attrs)) {
          if (key === "class") node.className = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else if (key === "disabled") node.disabled = value;
          else node.setAttribute(key, value);
        }
        for (const child of children.flat()) if (child != null) node.append(child.nodeType ? child : document.createTextNode(child));
        return node;
      }

      // ---- render ----
      function render() {
        const view = Game.replay(events);
        renderContext(view);
        renderCapture(view);
        renderReview(view);
        undoBtn.disabled = events.length === 0;
        $("#save").disabled = events.length === 0;
      }

      function renderContext(view) {
        contextEl.replaceChildren();
        if (view.phase === "setup" || view.phase === "over") return;
        const left = el("span", {}, `⚔️ Q${view.questNumber} · 📜 ${view.proposalNumber}/5 · 🛡️ ${view.teamSize}`);
        if (view.isHammer) left.append(" ", el("span", { class: "hammer" }, "🔨"));
        contextEl.append(left, el("span", {}, `👑 ${view.players[view.king]}`));
      }

      const PANELS = { setup: setupPanel, propose: proposePanel, vote: votePanel, quest: questPanel, over: overPanel };
      function renderCapture(view = Game.replay(events)) {
        captureEl.replaceChildren(PANELS[view.phase](view), el("div", { class: "error" }, ui.error));
      }

      // ---- phase panels ----
      // The game server to load players from: `?server=…` in the page address if given, else the public one.
      // A function, not a const, because freshUi() runs before this point in the script.
      function defaultServer() {
        return new URLSearchParams(location.search).get("server") || "https://thavalon.onrender.com";
      }

      // Fills the seats from the server's player list (join order) and crowns its first proposer.
      async function loadRoster() {
        let url;
        try { url = Game.rosterUrl(ui.setupServer, ui.setupGameId); }
        catch (error) { ui.error = error.message; renderCapture(); return; }
        ui.loading = true;
        ui.error = "";
        renderCapture();
        try {
          const response = await fetch(url, { cache: "no-store" });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(body.code === "GAME_NOT_FOUND" ? "No game with that ID." : body.message || `The server said ${response.status}.`);
          }
          const { players, firstKing } = Game.rosterToSetup(body);
          ui.setupNames = Array.from({ length: 10 }, (_, i) => players[i] ?? "");
          ui.setupKing = firstKing;
        } catch (error) {
          // fetch rejects with a TypeError when the network or the browser's cross-site check stops it.
          ui.error = error instanceof TypeError ? "Couldn't reach the THavalon server." : error.message;
        } finally {
          ui.loading = false;
          renderCapture();
        }
      }

      // Hold a row's ⠿ and drag: the row moves live in the DOM, and on release the new order is written
      // back to ui.setupNames (the 👑 follows its player). No redraw until then, or the drag would be lost.
      function dragSeat(event, row) {
        event.preventDefault();
        const handle = event.currentTarget;
        const list = row.parentElement;
        handle.setPointerCapture(event.pointerId);
        row.classList.add("dragging");
        const move = (e) => {
          const others = [...list.children].filter((r) => r !== row);
          const before = others.find((r) => { const box = r.getBoundingClientRect(); return e.clientY < box.top + box.height / 2; });
          list.insertBefore(row, before ?? null);
        };
        const drop = () => {
          handle.removeEventListener("pointermove", move);
          handle.removeEventListener("pointerup", drop);
          handle.removeEventListener("pointercancel", drop);
          const order = [...list.children].map((r) => Number(r.dataset.seat));
          const names = ui.setupNames;
          ui.setupNames = order.map((seat) => names[seat]);
          ui.setupKing = ui.setupKing < 0 ? -1 : order.indexOf(ui.setupKing);
          renderCapture();
        };
        handle.addEventListener("pointermove", move);
        handle.addEventListener("pointerup", drop);
        handle.addEventListener("pointercancel", drop);
      }

      function setupPanel() {
        const names = ui.setupNames;
        const rows = names.map((name, i) => {
          const input = el("input", { placeholder: `Seat ${i + 1}`, maxlength: "20", autocapitalize: "words" });
          input.value = name;
          input.addEventListener("input", () => { names[i] = input.value; });
          const pick = el("button", { class: `king-pick ${ui.setupKing === i ? "on" : ""}`, type: "button", title: "First king",
            onclick: () => { ui.setupKing = i; renderCapture(); } }, "👑");
          const handle = el("span", { class: "drag", title: "Hold and drag to move" }, "⠿");
          const row = el("label", { "data-seat": String(i) }, pick, el("span", { class: "seat-no" }, String(i + 1)), input, handle);
          handle.addEventListener("pointerdown", (event) => dragSeat(event, row));
          return row;
        });
        const gameId = el("input", { placeholder: "Game ID", maxlength: "12", autocapitalize: "characters", autocomplete: "off" });
        gameId.value = ui.setupGameId;
        gameId.addEventListener("input", () => { ui.setupGameId = gameId.value; });
        gameId.addEventListener("keydown", (event) => { if (event.key === "Enter") loadRoster(); });
        // 🌐 game server (prefilled, editable), then the game ID and 📥.
        const server = el("input", { placeholder: "thavalon.onrender.com", autocapitalize: "none", autocomplete: "off",
          spellcheck: "false", inputmode: "url", title: "Game server" });
        server.value = ui.setupServer;
        server.addEventListener("input", () => { ui.setupServer = server.value; });
        const roster = el("div", { class: "roster-box" },
          el("div", { class: "roster server" }, el("span", { class: "roster-icon", title: "Game server" }, "🌐"), server),
          el("div", { class: "roster" }, gameId,
            el("button", { class: "btn", type: "button", title: "Load players from the game server", disabled: ui.loading, onclick: loadRoster },
              ui.loading ? "⏳" : "📥")));
        // Dev convenience: tap the hint to fill ten names.
        const hint = el("p", { class: "hint", onclick: () => {
          ["Ann", "Bob", "Cal", "Dee", "Eve", "Fay", "Gus", "Hal", "Ivy", "Jon"].forEach((n, i) => names[i] = n);
          renderCapture();
        } }, "Names clockwise from any seat. Tap 👑 for the first king.");
        const start = el("button", { class: "btn primary", onclick: () => {
          const filled = names.map((name, seat) => ({ name: name.trim(), seat })).filter((p) => p.name);
          const firstKing = filled.findIndex((p) => p.seat === ui.setupKing);
          if (firstKing < 0) { ui.error = "Tap 👑 next to the first king."; renderCapture(); return; }
          tryAppend({ type: "setup", players: filled.map((p) => p.name), firstKing });
        } }, "▶️ Start game");
        return el("div", {}, el("h2", {}, "🪑 Players"), hint, el("div", { class: "names" }, rows), start, roster);
      }

      // Whoever will propose 5th this quest; kingship moves one seat per proposal.
      function hammerSeat(view) {
        return (view.king + 5 - view.proposalNumber) % view.players.length;
      }

      // Once someone has come out as Agravaine, they stay marked 👹 for the rest of the game.
      function revealedAgravaine(view) {
        return view.quests.find((quest) => quest.agravaine !== null && quest.agravaine !== undefined)?.agravaine ?? null;
      }

      // One seat on the ring: a round token with a mark inside, the name under it, crown for the king.
      function seat(view, index, extra) {
        // A revealed Agravaine shows 👹 in the middle of the token; their vote still shows through the token's colour.
        const token = el("span", { class: "token" },
          revealedAgravaine(view) === index ? el("span", { class: "agravaine-face" }, "👹") : extra.mark ?? "");
        if (index === view.king) token.append(el("span", { class: "crown" }, "👑"));
        if (extra.shield) token.append(el("span", { class: "shield" }, "🛡️"));
        if (index === hammerSeat(view)) token.append(el("span", { class: "hammer-mark" }, "🔨"));
        const node = el("button", { class: "seat", type: "button", onclick: extra.onclick }, token, el("span", { class: "name" }, view.players[index]));
        if (extra.class) node.classList.add(...extra.class.split(" ").filter(Boolean));
        return node;
      }

      // Players around the table, clockwise from the top, seating order; `center` sits in the middle.
      function ring(seats, center, centerClass = "") {
        const n = seats.length;
        seats.forEach((node, i) => {
          const angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
          node.style.left = `${50 + 39 * Math.cos(angle)}%`;
          node.style.top = `${50 + 39 * Math.sin(angle)}%`;
        });
        return el("div", { class: "ring" }, seats, el("div", { class: `center ${centerClass}` }, center));
      }

      function proposePanel(view) {
        const full = ui.chosen.size >= view.teamSize;
        const left = view.teamSize - ui.chosen.size;
        const seats = view.players.map((_, i) => seat(view, i, {
          class: ui.chosen.has(i) ? "selected" : full ? "dim" : "",
          shield: ui.chosen.has(i),
          onclick: () => { if (ui.chosen.has(i)) ui.chosen.delete(i); else if (!full) ui.chosen.add(i); renderCapture(view); }
        }));
        const center = [
          el("div", { class: "big" }, `${ui.chosen.size} / ${view.teamSize}`),
          el("div", { class: "sub" }, left === 0 ? "✅" : "🛡️".repeat(left))
        ];
        const label = view.isHammer ? "🔨 Send team" : "📜 Propose team";
        return el("div", {},
          ring(seats, center),
          el("button", { class: "btn primary", disabled: ui.chosen.size !== view.teamSize,
            onclick: () => tryAppend({ type: "propose", team: [...ui.chosen].sort((a, b) => a - b) }) }, label));
      }

      function votePanel(view) {
        const proposal = view.quests.at(-1).proposals.at(-1);
        const team = new Set(proposal.team);
        const n = view.players.length;
        // Quick fills; a preset lights up whenever the seats currently match it.
        const presets = [
          [`${n}👍`, view.players.map((_, i) => i)],
          ["🛡️👍", proposal.team],
          [`${n}👎`, []]
        ];
        const same = (list) => list.length === ui.approvals.size && list.every((i) => ui.approvals.has(i));
        const presetBar = el("div", { class: "presets" }, presets.map(([label, list]) =>
          el("button", { class: `btn ${same(list) ? "on" : ""}`, type: "button",
            onclick: () => { ui.approvals = new Set(list); renderCapture(view); } }, label)));
        const seats = view.players.map((_, i) => seat(view, i, {
          class: `${ui.approvals.has(i) ? "approve" : "reject"} ${team.has(i) ? "team" : ""}`,
          mark: ui.approvals.has(i) ? "👍" : "👎",
          shield: team.has(i),
          onclick: () => { if (ui.approvals.has(i)) ui.approvals.delete(i); else ui.approvals.add(i); renderCapture(view); }
        }));
        const yes = ui.approvals.size, passes = yes > n / 2;
        const center = el("div", { class: "big" }, `${yes}–${n - yes}`);
        return el("div", {},
          ring(seats, center, `verdict ${passes ? "pass" : "fail"}`),
          presetBar,
          el("button", { class: "btn primary", onclick: () => tryAppend({ type: "vote", approvals: [...ui.approvals].sort((a, b) => a - b) }) }, "🗳️ Record vote"));
      }

      // A quest's cards as emoji: ✅ successes, ❌ fails (one of them drawn 👹 when it is Agravaine's), 🎭 rogues.
      function cardText(size, fails, rogues, agravaine) {
        const ownFail = agravaine ? 1 : 0;
        return "✅".repeat(size - fails - rogues) + "❌".repeat(fails - ownFail) + "👹".repeat(ownFail) + "🎭".repeat(rogues);
      }

      function questPanel(view) {
        const proposal = view.quests.at(-1).proposals.at(-1);
        // One row per possible outcome, all ✅ down to all ❌ (plus any 🎭); each row is tinted by what the
        // model would rule, so the quest-4 two-fail rule and a rogue's flip show themselves.
        const size = proposal.team.length;
        const rogues = ui.rogues, agravaine = ui.agravaine;
        // With Agravaine out, one fail card is his: rows start at one ❌ and draw it as 👹; the rest are the other cards.
        const minFails = agravaine !== null ? 1 : 0;
        const rows = Array.from({ length: size - rogues - minFails + 1 }, (_, k) => {
          const n = k + minFails;
          const failed = n >= view.failsToFail;
          const outcome = agravaine !== null || failed !== (rogues === 1) ? "fail" : "pass";
          return el("button", { class: `btn ${outcome} ${ui.fails === n ? "on" : ""}`, type: "button",
            onclick: () => { ui.fails = n; renderCapture(view); } }, cardText(size, n, rogues, agravaine !== null));
        });
        // Rare: cycles 0 → 1 → 2 → 0 rogue cards (never more than the team has cards, leaving room for Agravaine's).
        const maxRogues = Math.min(2, size - minFails);
        const rogueBtn = el("button", { class: `btn ${rogues ? "on" : ""}`, type: "button",
          onclick: () => { ui.rogues = (rogues + 1) % (maxRogues + 1); ui.fails = null; renderCapture(view); } }, `🎭 ${rogues}`);
        // Marking or clearing Agravaine changes which rows exist, so drop a selection that no longer fits.
        const toggleAgravaine = (i) => {
          ui.agravaine = agravaine === i ? null : i;
          if (ui.agravaine !== null) {
            ui.rogues = Math.min(ui.rogues, Math.min(2, size - 1));
            if (ui.fails === 0) ui.fails = null;
          }
          renderCapture(view);
        };
        return el("div", {},
          el("div", { class: "fails" }, rows),
          el("div", { class: "rogue" }, rogueBtn),
          el("button", { class: "btn primary", disabled: ui.fails === null,
            onclick: () => tryAppend({ type: "quest", fails: ui.fails, rogues, agravaine }) }, "⚔️ Record quest"),
          // Tap the team member who comes out as Agravaine (👹); tap again to clear. It fails the quest outright.
          el("div", { class: "quest-team" }, proposal.team.map((i) =>
            el("button", { type: "button", class: agravaine === i ? "agravaine" : "", onclick: () => toggleAgravaine(i) },
              `${agravaine === i ? "👹" : "🛡️"} ${view.players[i]}`))));
      }

      function overPanel(view) {
        return el("div", { class: "over" },
          el("div", { class: `winner ${view.winner}` }, view.winner === "good" ? "🏆 GOOD" : "🏆 EVIL"),
          el("div", {}, `✅ ${view.score.pass} – ${view.score.fail} ❌`),
          el("p", { class: "hint" }, "🗡️ assassination not tracked"),
          el("button", { class: "btn primary", onclick: newGame }, "🆕 New game"));
      }

      // ---- review: one row per proposal, one column per seat; team = shaded cells ----
      function renderReview(view) {
        reviewEl.replaceChildren();
        if (view.phase === "setup") return;
        const score = el("div", { class: "score" },
          [1, 2, 3, 4, 5].map((n) => {
            const q = view.quests[n - 1];
            const state = q?.result ? q.result : (n === view.questNumber && view.phase !== "over") ? "now" : "todo";
            const sym = { pass: "✅", fail: "❌", now: "⚔️", todo: "○" }[state];
            const cell = el("div", { class: `q ${state}` }, el("b", {}, sym), String(n));
            return cell;
          }));
        const head = el("tr", {}, el("th", { class: "label" }),
          view.players.map((name, i) => el("th", { class: "vname" },
            el("span", {}, name.slice(0, 8) + (revealedAgravaine(view) === i ? "👹" : "")))), el("th", { class: "res" }));
        const width = String(view.players.length + 2);
        const rows = [];
        view.quests.forEach((quest) => {
          quest.proposals.forEach((p, pi) => {
            const hammer = p.approvals === null && p.approved === true;
            const tr = el("tr", { class: pi === 0 ? "quest-start" : "" }, el("td", { class: "label" }, pi === 0 ? String(quest.number) : ""));
            view.players.forEach((_, i) => {
              let text = "·", cls = "pending";
              if (p.approvals !== null) {
                // Votes against expectation get their own icon: 🐸 approved a team they're not on, 🍎 rejected their own team.
                const yes = p.approvals.includes(i), onTeam = p.team.includes(i);
                text = yes ? (onTeam ? "🟢" : "🐸") : (onTeam ? "🍎" : "🔴");
                cls = yes ? "yes" : "no";
              }
              else if (hammer) { text = ""; cls = ""; }
              const td = el("td", { class: `${cls} ${p.team.includes(i) ? "team" : ""}` }, text);
              if (p.king === i) td.append(el("span", { class: "crown" }, "👑"));
              tr.append(td);
            });
            const res = hammer ? "🔨" : p.approved === null ? "" : el("span", { class: `vdot ${p.approved ? "g" : "r"}` });
            tr.append(el("td", { class: "res" }, res));
            rows.push(tr);
          });
          if (quest.result) {
            const size = quest.proposals.at(-1).team.length;
            rows.push(el("tr", { class: "result" }, el("td", { class: "label" }, "⚔️"),
              el("td", { class: quest.result, colspan: String(view.players.length + 1) },
                cardText(size, quest.fails, quest.rogues, quest.agravaine !== null))));
            rows.push(el("tr", { class: "gap" }, el("td", { colspan: width })));
          }
        });
        reviewEl.append(score, el("table", { class: "grid" }, el("thead", {}, head), el("tbody", {}, rows)));
      }

      // ---- tabs and swipe ----
      function showTab(name) {
        tab = name;
        const x = name === "review" ? "-100%" : "0";
        captureEl.style.transform = reviewEl.style.transform = `translateX(${x})`;
        document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
      }
      document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
      let touch = null;
      // Swipes that start at the very edge belong to the browser (iPhone's edge swipe is "back" = undo), so ignore them here.
      // A drag on a seat's ⠿ handle is a reorder, not a screen flip.
      $("#screens").addEventListener("touchstart", (e) => {
        const x = e.touches[0].clientX;
        const edge = x < 24 || x > window.innerWidth - 24;
        touch = edge || e.target.closest(".drag") ? null : { x, y: e.touches[0].clientY };
      }, { passive: true });
      $("#screens").addEventListener("touchend", (e) => {
        if (!touch) return;
        const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
        touch = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) showTab(dx < 0 ? "review" : "capture");
      }, { passive: true });

      // ---- header actions ----
      undoBtn.addEventListener("click", back);
      function newGame() {
        if (events.length && !confirm("Clear this game and start a new one?")) return;
        localStorage.removeItem(STORAGE_KEY);
        commit(Game.create());
        showTab("capture");
      }
      $("#new-game").addEventListener("click", newGame);

      // Save: the event log is the save file. Phones that can share files get the share sheet
      // (Files, Drive, Messages…); otherwise the browser downloads it.
      async function saveGame() {
        if (!events.length) return;
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
        const name = `thavalon-${stamp}.json`;
        const file = new File([Game.serialize(events)], name, { type: "application/json" });
        if (navigator.canShare?.({ files: [file] })) {
          try { await navigator.share({ files: [file] }); return; }
          catch (error) { if (error.name === "AbortError") return; }
        }
        const url = URL.createObjectURL(file);
        const link = el("a", { href: url, download: name });
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      $("#save").addEventListener("click", saveGame);

      // Load: pick a saved file; the model validates every event before it replaces the current game.
      const loadFile = $("#load-file");
      $("#load").addEventListener("click", () => loadFile.click());
      loadFile.addEventListener("change", async () => {
        const file = loadFile.files[0];
        loadFile.value = "";
        if (!file) return;
        let loaded;
        try { loaded = Game.deserialize(await file.text()); }
        catch (error) { alert(`Can't load that file: ${error.message}`); return; }
        if (events.length && !confirm("Replace the current game with the loaded one?")) return;
        commit(loaded);
        showTab("review");
      });


      // The phone's back button is undo. One extra history entry is kept on top; pressing back pops it
      // (firing popstate while we're still on the page), we undo, and push it again. With nothing left
      // to undo, back asks before leaving. The game is autosaved either way.
      history.pushState({ thavalon: true }, "");
      window.addEventListener("popstate", () => {
        if (events.length) { back(); history.pushState({ thavalon: true }, ""); return; }
        if (confirm("Leave the tracker?")) { history.back(); return; }
        history.pushState({ thavalon: true }, "");
      });
      window.addEventListener("beforeunload", (e) => {
        if (!events.length) return;
        e.preventDefault();
        e.returnValue = "";
      });

      render();
      showTab("capture");
    })();
  </script>
</body>
</html>
